<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ルーレット</title>
<style>
  :root {
    --bg: #f4f5f8;
    --card: #ffffff;
    --text: #1f2330;
    --muted: #6b7080;
    --border: #e1e3ea;
    --accent: #ff5a5f;
    --accent-dark: #e0474c;
    --btn: #eef0f5;
    --btn-hover: #e2e5ee;
    --pointer: #1f2330;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15171c;
      --card: #22252d;
      --text: #eceef3;
      --muted: #9aa0ad;
      --border: #353945;
      --btn: #2e323c;
      --btn-hover: #3a3f4b;
      --pointer: #eceef3;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Meiryo, sans-serif;
    line-height: 1.5;
  }
  main {
    max-width: 520px;
    margin: 0 auto;
    padding: 16px 16px 40px;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    margin: 8px 0 16px;
  }
  .wheel-wrap {
    position: relative;
    width: 100%;
    max-width: 400px;
    margin: 0 auto;
  }
  #wheel {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 1 / 1;
  }
  .pointer {
    position: absolute;
    top: -4px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 16px solid transparent;
    border-right: 16px solid transparent;
    border-top: 28px solid var(--pointer);
    filter: drop-shadow(0 2px 2px rgba(0, 0, 0, .3));
  }
  #result {
    min-height: 2.4em;
    margin: 12px 0;
    text-align: center;
    font-size: 1.35rem;
    font-weight: 700;
    word-break: break-all;
  }
  button {
    font: inherit;
    color: var(--text);
    background: var(--btn);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 14px;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--btn-hover); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  #spin {
    display: block;
    width: 100%;
    padding: 14px;
    font-size: 1.25rem;
    font-weight: 700;
    color: #fff;
    background: var(--accent);
    border: none;
    border-radius: 12px;
  }
  #spin:hover:not(:disabled) { background: var(--accent-dark); }
  .mode-row {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 12px;
    margin: 14px 0;
  }
  .mode-row label {
    display: flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
  }
  .mode-row input { width: 18px; height: 18px; margin: 0; }
  #remaining { color: var(--muted); }
  #resetDraw { margin-left: auto; padding: 6px 12px; }
  [hidden] { display: none !important; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
  }
  .add-row { display: flex; gap: 8px; }
  #newItem {
    flex: 1;
    min-width: 0;
    font: inherit;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
  }
  #items {
    list-style: none;
    margin: 12px 0;
    padding: 0;
  }
  #items li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 2px;
    border-bottom: 1px solid var(--border);
  }
  #items li:last-child { border-bottom: none; }
  .dot {
    flex: none;
    width: 14px;
    height: 14px;
    border-radius: 50%;
  }
  .name {
    flex: 1;
    min-width: 0;
    word-break: break-all;
  }
  li.drawn .name { text-decoration: line-through; color: var(--muted); }
  .del {
    flex: none;
    padding: 2px 9px;
    font-size: .9rem;
    line-height: 1.6;
  }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .note {
    margin: 12px 0 0;
    font-size: .85rem;
    color: var(--muted);
  }
</style>
</head>
<body>
<main>
  <h1>🎯 ルーレット</h1>

  <div class="wheel-wrap">
    <canvas id="wheel" width="800" height="800"></canvas>
    <div class="pointer" aria-hidden="true"></div>
  </div>

  <div id="result" aria-live="polite"></div>

  <button id="spin" type="button">回す！</button>

  <div class="mode-row">
    <label><input type="checkbox" id="noRepeat"> 重複なしモード</label>
    <span id="remaining" hidden></span>
    <button id="resetDraw" type="button" hidden>抽選リセット</button>
  </div>

  <section class="card">
    <div class="add-row">
      <input id="newItem" type="text" maxlength="40" placeholder="選択肢を入力" autocomplete="off">
      <button id="addBtn" type="button">追加</button>
    </div>
    <ul id="items"></ul>
    <div class="tools">
      <button id="shuffleBtn" type="button">並べ替え</button>
      <button id="defaultBtn" type="button">初期値に戻す</button>
    </div>
    <p class="note">選択肢はこのブラウザに自動保存されます。</p>
  </section>
</main>

<script>
(() => {
  'use strict';

  const DEFAULT_ITEMS = ['A（ラ）', 'B（シ）', 'C（ド）', 'D（レ）', 'E（ミ）', 'F（ファ）', 'G（ソ）'];
  const ITEMS_KEY = 'roulette-items-v2';
  const STATE_KEY = 'roulette-state-v2';
  const COLORS = ['#ff6b6b', '#ffa94d', '#ffd43b', '#69db7c', '#38d9a9', '#4dabf7', '#748ffc', '#da77f2'];
  const DRAWN_COLOR = '#b5b5b5';
  const SPIN_MS = 1500;
  const TAU = Math.PI * 2;

  const $ = (id) => document.getElementById(id);
  const canvas = $('wheel');
  const ctx = canvas.getContext('2d');
  const resultEl = $('result');
  const spinBtn = $('spin');
  const noRepeatEl = $('noRepeat');
  const remainingEl = $('remaining');
  const resetDrawBtn = $('resetDraw');
  const newItemEl = $('newItem');
  const addBtn = $('addBtn');
  const listEl = $('items');
  const shuffleBtn = $('shuffleBtn');
  const defaultBtn = $('defaultBtn');

  let items = loadItems();
  let state = loadState();
  let rotation = 0; // 時計回りの回転角（ラジアン）
  let spinning = false;

  // ---- 保存 ----
  function loadItems() {
    try {
      const v = JSON.parse(localStorage.getItem(ITEMS_KEY));
      if (Array.isArray(v) && v.length > 0 && v.every((s) => typeof s === 'string')) return v;
    } catch (e) { /* 初期値を使う */ }
    return DEFAULT_ITEMS.slice();
  }

  function loadState() {
    try {
      const v = JSON.parse(localStorage.getItem(STATE_KEY));
      if (v && typeof v === 'object') {
        return {
          noRepeat: v.noRepeat === true,
          drawn: Array.isArray(v.drawn) ? v.drawn.filter((s) => typeof s === 'string') : [],
        };
      }
    } catch (e) { /* 初期値を使う */ }
    return { noRepeat: false, drawn: [] };
  }

  function save() {
    state.drawn = state.drawn.filter((name) => items.includes(name));
    try {
      localStorage.setItem(ITEMS_KEY, JSON.stringify(items));
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch (e) { /* 保存できなくても動作は続ける */ }
  }

  // ---- 状態 ----
  function isDrawn(name) {
    return state.noRepeat && state.drawn.includes(name);
  }

  function allDrawn() {
    return items.length > 0 && items.every((name) => state.drawn.includes(name));
  }

  function colorAt(i, n) {
    if (n > 1 && i === n - 1 && i % COLORS.length === 0) return COLORS[1];
    return COLORS[i % COLORS.length];
  }

  // ---- 描画 ----
  function truncate(label) {
    const chars = Array.from(label);
    return chars.length > 10 ? chars.slice(0, 10).join('') + '…' : label;
  }

  function drawWheel() {
    const size = canvas.width;
    const c = size / 2;
    const r = c - 12;
    const n = items.length;
    ctx.clearRect(0, 0, size, size);

    if (n === 0) {
      ctx.beginPath();
      ctx.arc(c, c, r, 0, TAU);
      ctx.fillStyle = '#d0d0d0';
      ctx.fill();
      ctx.fillStyle = '#555';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('選択肢を追加してね', c, c);
      return;
    }

    const seg = TAU / n;
    const fontSize = Math.max(22, Math.min(48, Math.round(56 - n * 2)));

    ctx.save();
    ctx.translate(c, c);
    ctx.rotate(rotation);

    for (let i = 0; i < n; i++) {
      const start = -Math.PI / 2 + i * seg;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.arc(0, 0, r, start, start + seg);
      ctx.closePath();
      ctx.fillStyle = isDrawn(items[i]) ? DRAWN_COLOR : colorAt(i, n);
      ctx.fill();
      if (n > 1) {
        ctx.strokeStyle = 'rgba(255,255,255,.85)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      ctx.save();
      ctx.rotate(start + seg / 2);
      ctx.font = `bold ${fontSize}px sans-serif`;
      ctx.textAlign = 'right';
      ctx.textBaseline = 'middle';
      ctx.lineWidth = Math.max(3, fontSize / 8);
      ctx.strokeStyle = 'rgba(0,0,0,.35)';
      ctx.fillStyle = '#fff';
      const label = truncate(items[i]);
      ctx.strokeText(label, r - 28, 0);
      ctx.fillText(label, r - 28, 0);
      ctx.restore();
    }
    ctx.restore();

    // 中心
    ctx.beginPath();
    ctx.arc(c, c, 34, 0, TAU);
    ctx.fillStyle = '#fff';
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = 'rgba(0,0,0,.15)';
    ctx.stroke();
  }

  function renderList() {
    listEl.textContent = '';
    const n = items.length;
    items.forEach((name, i) => {
      const li = document.createElement('li');
      const drawn = isDrawn(name);
      if (drawn) li.classList.add('drawn');

      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = drawn ? DRAWN_COLOR : colorAt(i, n);

      const label = document.createElement('span');
      label.className = 'name';
      label.textContent = name;

      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'del';
      del.textContent = '✕';
      del.setAttribute('aria-label', `${name} を削除`);
      del.disabled = spinning;
      del.addEventListener('click', () => removeItem(i));

      li.append(dot, label, del);
      listEl.appendChild(li);
    });
  }

  function renderControls() {
    spinBtn.disabled = spinning || items.length < 2;
    addBtn.disabled = spinning;
    newItemEl.disabled = spinning;
    shuffleBtn.disabled = spinning;
    defaultBtn.disabled = spinning;
    noRepeatEl.disabled = spinning;
    resetDrawBtn.disabled = spinning;
    noRepeatEl.checked = state.noRepeat;

    remainingEl.hidden = !state.noRepeat;
    resetDrawBtn.hidden = !state.noRepeat;
    const remaining = items.filter((name) => !state.drawn.includes(name)).length;
    remainingEl.textContent = `残り ${remaining} / ${items.length}`;
  }

  function render() {
    drawWheel();
    renderList();
    renderControls();
  }

  function update() {
    save();
    render();
  }

  // ---- 操作 ----
  function addItem() {
    if (spinning) return;
    const name = newItemEl.value.trim();
    if (!name) return;
    items.push(name);
    newItemEl.value = '';
    update();
    newItemEl.focus();
  }

  function removeItem(i) {
    if (spinning) return;
    items.splice(i, 1);
    update();
  }

  function shuffle() {
    if (spinning) return;
    for (let i = items.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [items[i], items[j]] = [items[j], items[i]];
    }
    update();
  }

  function resetToDefault() {
    if (spinning) return;
    if (!confirm('選択肢を初期値に戻しますか？')) return;
    items = DEFAULT_ITEMS.slice();
    resultEl.textContent = '';
    update();
  }

  function toggleNoRepeat() {
    if (spinning) return;
    state.noRepeat = noRepeatEl.checked;
    state.drawn = [];
    update();
  }

  function resetDraw() {
    if (spinning) return;
    state.drawn = [];
    update();
  }

  // ---- 抽選と回転 ----
  function spin() {
    if (spinning || items.length < 2) return;

    if (state.noRepeat && allDrawn()) state.drawn = [];

    const n = items.length;
    const candidates = [];
    for (let i = 0; i < n; i++) {
      if (!state.noRepeat || !state.drawn.includes(items[i])) candidates.push(i);
    }
    const winner = candidates[Math.floor(Math.random() * candidates.length)];

    // 当選扇形の中心 ±40% の位置がポインター（真上）に来る回転角
    const seg = TAU / n;
    const offset = (Math.random() * 0.8 - 0.4) * seg;
    const target = -((winner + 0.5) * seg + offset);
    const diff = (((target - rotation) % TAU) + TAU) % TAU;
    const extraTurns = 2 + Math.floor(Math.random() * 2);
    const from = rotation;
    const total = diff + extraTurns * TAU;

    spinning = true;
    resultEl.textContent = '';
    save();
    render();

    const startTime = performance.now();
    const step = (now) => {
      const t = Math.min(1, (now - startTime) / SPIN_MS);
      const eased = 1 - Math.pow(1 - t, 4);
      rotation = from + total * eased;
      drawWheel();
      if (t < 1) {
        requestAnimationFrame(step);
      } else {
        rotation %= TAU;
        finish(winner);
      }
    };
    requestAnimationFrame(step);
  }

  function finish(winner) {
    spinning = false;
    const name = items[winner];
    let text = `🎉 ${name}`;
    if (state.noRepeat) {
      if (!state.drawn.includes(name)) state.drawn.push(name);
      if (allDrawn()) text += '（全部出ました！）';
    }
    resultEl.textContent = text;
    update();
  }

  // ---- イベント ----
  spinBtn.addEventListener('click', spin);
  addBtn.addEventListener('click', addItem);
  newItemEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) {
      e.preventDefault();
      addItem();
    }
  });
  shuffleBtn.addEventListener('click', shuffle);
  defaultBtn.addEventListener('click', resetToDefault);
  noRepeatEl.addEventListener('change', toggleNoRepeat);
  resetDrawBtn.addEventListener('click', resetDraw);

  save();
  render();
})();
</script>
</body>
</html>
